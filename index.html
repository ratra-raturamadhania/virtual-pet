<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mochi Room</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game">

    <header class="hud">
      <div>
        <span class="tiny">MOCHI ROOM</span>
        <h1 id="petName">Mochi</h1>
      </div>

      <div class="hud-right">
        <div>⭐ Lv <span id="level">1</span></div>
        <div>🪙 <span id="coins">100</span></div>
      </div>
    </header>

    <section class="room" id="room">

      <div class="window">
        <div class="sky">☁️</div>
      </div>

      <div class="wall-decoration">♡</div>

      <div class="speech hidden" id="speech">
        meow!
      </div>

      <div class="pet-wrapper" id="petWrapper">
        <div class="effect" id="effect"></div>
        <div class="pet" id="pet">🐱</div>
      </div>

      <div class="bed" id="bed">
        <span>🛏️</span>
        <small>sleep</small>
      </div>

      <div class="bath" id="bath">
        <span>🛁</span>
        <small>bath</small>
      </div>

      <div class="floor-shadow"></div>

    </section>

    <section class="stats">
      <div class="stat">
        <span>🍗</span>
        <div class="bar"><div id="hungerBar"></div></div>
      </div>

      <div class="stat">
        <span>💗</span>
        <div class="bar"><div id="happyBar"></div></div>
      </div>

      <div class="stat">
        <span>⚡</span>
        <div class="bar"><div id="energyBar"></div></div>
      </div>

      <div class="stat">
        <span>🫧</span>
        <div class="bar"><div id="cleanBar"></div></div>
      </div>
    </section>

    <section class="inventory">

      <div class="item" draggable="true" data-item="food">
        <span>🍗</span>
        <small>Food</small>
      </div>

      <div class="item" draggable="true" data-item="ball">
        <span>🎾</span>
        <small>Ball</small>
      </div>

      <div class="item" draggable="true" data-item="fish">
        <span>🐟</span>
        <small>Fish</small>
      </div>

      <button class="rename" onclick="renamePet()">
        ✏️ Rename
      </button>

    </section>

    <p class="hint">
      drag food or toys to your pet • click the pet to pet them
    </p>

  </main>

  <script src="script.js"></script>
</body>
</html>
