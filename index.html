<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Pet</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="game-container">

    <header class="topbar">
      <div>
        <p class="eyebrow">VIRTUAL PET</p>
        <h1>Take care of your little friend</h1>
      </div>

      <div class="coin-box">
        🪙 <span id="coins">100</span>
      </div>
    </header>

    <section class="pet-card">

      <div class="pet-top">
        <div>
          <p class="label">PET NAME</p>
          <h2 id="petName">Mochi</h2>
        </div>

        <button class="rename-btn" onclick="renamePet()">
          Rename
        </button>
      </div>

      <div class="pet-area">

        <div class="pet-emoji" id="petEmoji">
          🐱
        </div>

        <p class="mood" id="petMood">
          Mochi is feeling happy!
        </p>

      </div>

      <div class="stats">

        <div class="stat">
          <div class="stat-header">
            <span>🍗 Hunger</span>
            <span id="hungerText">80%</span>
          </div>
          <div class="bar">
            <div class="fill" id="hungerBar"></div>
          </div>
        </div>

        <div class="stat">
          <div class="stat-header">
            <span>💖 Happiness</span>
            <span id="happinessText">80%</span>
          </div>
          <div class="bar">
            <div class="fill" id="happinessBar"></div>
          </div>
        </div>

        <div class="stat">
          <div class="stat-header">
            <span>⚡ Energy</span>
            <span id="energyText">80%</span>
          </div>
          <div class="bar">
            <div class="fill" id="energyBar"></div>
          </div>
        </div>

        <div class="stat">
          <div class="stat-header">
            <span>🫧 Cleanliness</span>
            <span id="cleanlinessText">80%</span>
          </div>
          <div class="bar">
            <div class="fill" id="cleanlinessBar"></div>
          </div>
        </div>

      </div>

      <div class="actions">

        <button onclick="feedPet()">
          🍗 Feed
        </button>

        <button onclick="playPet()">
          🎾 Play
        </button>

        <button onclick="sleepPet()">
          😴 Sleep
        </button>

        <button onclick="cleanPet()">
          🫧 Clean
        </button>

      </div>

    </section>

    <section class="info-card">

      <div>
        <p class="label">LEVEL</p>
        <strong id="level">1</strong>
      </div>

      <div>
        <p class="label">XP</p>
        <strong><span id="xp">0</span> / 100</strong>
      </div>

      <div>
        <p class="label">STATUS</p>
        <strong id="status">Healthy</strong>
      </div>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
